name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ClientMod-1.zip
        id: p
        run: |
          unzip -q ClientMod-1.zip -d tmp
          mv tmp/ClientMod ClientMod
          if grep -q '8.5.2' ClientMod/build.gradle.kts; then
            echo "g=8.9" >> $GITHUB_OUTPUT
          else
            echo "g=7.5.1" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.p.outputs.g }}
      - run: cd ClientMod && gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MirezClient
          path: ClientMod/app/build/outputs/apk/debug/app-debug.apk
